org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.parallel=true
# 配置缓存暂时不能开：AGP 9 内置 Kotlin + chaquopy 会让 :chaquo 的 debug 变体在
# :catvod 的 abi 维度上匹配失败（:catvod 没有 abi flavor），而 CC 会连没被请求的
# debug 任务一起序列化，导致 release 构建也被拖挂。等上游修了插件兼容再开。
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=false
